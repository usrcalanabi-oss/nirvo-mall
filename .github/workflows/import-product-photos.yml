name: Import NIRVO product photos
on:
  push:
    branches:
      - feat/walkable-mall-controls
    paths:
      - .github/workflows/import-product-photos.yml
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/walkable-mall-controls
          fetch-depth: 0
      - name: Extract the original product photo archives from main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/nirvo-photo-import public/products/imported
          git show origin/main:nirvo-products.zip > /tmp/nirvo-photo-import/batch1.zip
          git show origin/main:nirvo-products-batch2.zip > /tmp/nirvo-photo-import/batch2.zip
          unzip -oq /tmp/nirvo-photo-import/batch1.zip -d public/products/imported
          unzip -oq /tmp/nirvo-photo-import/batch2.zip -d public/products/imported
          echo "Imported files:"
          find public/products/imported -type f | sort
      - name: Commit imported original photos
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products/imported
          if git diff --cached --quiet; then
            echo "No new product photos to commit."
          else
            git commit -m "Import original NIRVO product photos"
            git push origin HEAD:feat/walkable-mall-controls
          fi
